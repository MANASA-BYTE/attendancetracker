<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CivicPath</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    
        body {
    
    background-image: url('ll.avif');
    background-repeat: no-repeat;
    background-size: cover; /* Ensures the background covers the entire viewport */
    background-position: center; /* Centers the background image */
    font-family: 'Cursive';
    margin: 0;
    height: 100vh; /* Sets the height to the full viewport */
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    text-align: center; /* Centers text inside the container */
    background: rgba(0, 0, 0, 0.6); /* Semi-transparent background for better contrast */
    color: white;
    padding: 20px;
    border-radius: 10px; /* Rounded corners for a better look */
}

        .login-box {
           background: rgba(151, 148, 160, 0.9);
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(132, 126, 126, 0.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-box h2 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .form-control {
            border-radius: 30px;
            padding: 10px 15px;
            font-size: 1rem;
        }

        .btn-primary {
           /* background: #007bff;*/
            border: none;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            padding: 10px;
            width: 100%;
        }
    
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="mb-3">
                <input type="text" class="form-control" id="username" placeholder="Username" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
            </div>
            <button type="submit" id="loginBtn" class="btn btn-primary">Login</button>
        </form>
    </div>
    <script>
        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', async (event) => {
            event.preventDefault(); // Prevent form from reloading the page

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                // Send a POST request to the login endpoint
                const response = await fetch('http://localhost:5000/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.message); // Success message
                    window.location.href = 'welcomee.html'; // Redirect to welcome page
                } else {
                    alert(data.error || 'Invalid username or password');
                }
            } catch (error) {
                alert('Error connecting to the server');
            }
        });
    </script>
</body>
</html>
