<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Problems</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-image: url('pending.jpg');
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            color: white;
        }
        .problems-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px;
            width: 80%;
            max-width: 800px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            margin-bottom: 20px;
        }
        .problem {
            background: rgba(0, 0, 0, 0.5);
            margin: 15px 0;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        .problem:hover {
            transform: scale(1.03);
        }
        .loading, .error {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="problems-box">
        <h1>Pending Problems</h1>
        <div id="pending-problems-list" class="problems-list"></div>
    </div>

    <script>
        async function loadPendingProblems() {
            const problemsList = document.getElementById('pending-problems-list');
            problemsList.innerHTML = '<p class="loading">Loading...</p>';

            try {
                const response = await fetch('http://localhost:5000/api/problems/pendingProblems');
                if (!response.ok) {
                    throw new Error('Failed to fetch pending problems');
                }

                const problems = await response.json();
                console.log('Pending Problems:', problems);

                problemsList.innerHTML = '';

                if (problems.length === 0) {
                    problemsList.innerHTML = '<p>No pending problems yet.</p>';
                    return;
                }

                problems.forEach(problem => {
                    const problemDiv = document.createElement('div');
                    problemDiv.classList.add('problem');
                    problemDiv.innerHTML = `
                        <h3>Problem ID: ${problem.problemID}</h3>
                        <p>Description: ${problem.description}</p>
                    `;
                    problemsList.appendChild(problemDiv);
                });
            } catch (error) {
                console.error('Error loading pending problems:', error);
                problemsList.innerHTML = '<p class="error">Error loading pending problems.</p>';
            }
        }

        loadPendingProblems();
    </script>
</body>
</html>
