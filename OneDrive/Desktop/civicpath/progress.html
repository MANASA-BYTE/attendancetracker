<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Problem Resolution - CivicPath</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('https://via.placeholder.com/1920x1080') repeat center center fixed;
            background-size: cover;
            animation: moveBackground 20s linear infinite;
            background-image: url("progress2.jpg");
        }
        @keyframes moveBackground {
            0% { background-position: 0 0; }
            100% { background-position: 1000px 0; }
        }
        .form-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .form-container h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .form-container img#imagePreview {
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .btn-primary {
            background-color: #007bff;
            border: none;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container form-container">
        <h3>Track a Problem's Resolution</h3>
        <form id="progressForm" onsubmit="reportProgress(event)">
            <!-- Problem ID -->
            <div class="mb-3">
                <label for="problemID" class="form-label">Problem ID</label>
                <input type="text" class="form-control" id="problemID" name="problemID" required>
            </div>

            <!-- Proof Image -->
            <div class="mb-3">
                <label for="proofImage" class="form-label">Proof of Resolution (Image)</label>
                <input type="file" class="form-control" id="proofImage" name="proofImage" accept="image/*" required onchange="previewImage(event)">
                <img id="imagePreview" src="" alt="Proof Image" style="max-width: 100%; margin-top: 10px; display: none;">
            </div>

            <!-- User Email -->
            <div class="mb-3">
                <label for="userEmail" class="form-label">Your Email</label>
                <input type="email" class="form-control" id="userEmail" name="userEmail" required>
            </div>

            <!-- User Votes -->
            <div class="mb-3">
                <label class="form-label">Vote on Resolution</label>
                <div class="d-flex">
                    <button type="button" class="btn btn-success me-2" onclick="voteResolution('resolved')">Vote as Resolved</button>
                    <button type="button" class="btn btn-danger" onclick="voteResolution('pending')">Vote as Pending</button>
                </div>
                <input type="hidden" id="voteStatus" name="voteStatus" value="">
            </div>

            <button type="submit" class="btn btn-primary w-100">Submit</button>
        </form>
    </div>
<!----
    <div class="container mt-3">
        <h5>Confirmed Neighbors</h5>
        <ul id="confirmed-users"></ul>
    </div>-->

    <script>
    
        function previewImage(event) {
            const image = event.target.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById("imagePreview").src = e.target.result;
                document.getElementById("imagePreview").style.display = "block";
            };
            reader.readAsDataURL(image);
        }

        // Set the vote status (resolved or pending)
        function voteResolution(status) {
            document.getElementById("voteStatus").value = status;
        }

        // Handle form submission
        async function reportProgress(event) {
            event.preventDefault();

            const problemID = document.getElementById("problemID").value;
            const proofImage = document.getElementById("proofImage").files[0];
            const userEmail = document.getElementById("userEmail").value;
            const voteStatus = document.getElementById("voteStatus").value;

            if (!proofImage) {
                alert("Please upload an image.");
                return;
            }

            const formData = new FormData();
            formData.append("problemID", problemID);
            formData.append("proofImage", proofImage);
            formData.append("userEmail", userEmail);
            formData.append("voteStatus", voteStatus);
            console.log("Form Data:", [...formData.entries()]);

            try {
                const response = await fetch("http://localhost:5000/api/problems/progress", {
                    method: "POST",
                    body: formData,
                });

                const result = await response.json();
                if (response.ok) {
                    alert(result.message || "Progress reported successfully!");

                    
                    const usersList = document.getElementById('confirmed-users');
                    usersList.innerHTML = result.confirmedUsers
                        .map(user => `<li>${user}</li>`)
                        .join('');
                    
                    window.location.href = "welcomee.html"; // Redirect after successful submission
                } else {
                    alert(result.error || "Error reporting progress.");
                }
            } catch (error) {
                alert("Error connecting to the server.");
                console.error(error);
            }
        }
    </script>

</body>
</html>
