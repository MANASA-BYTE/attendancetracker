<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report a Problem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBTsGGVgwEhZA5H4bIhuuhU3cUmOHF1ydo&callback=initMap"></script>
    <script>
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBTsGGVgwEhZA5H4bIhuuhU3cUmOHF1ydo&callback=initMap"
    async
    defer>
</script>

    </script>
    <style>


        body {
            background: linear-gradient(to bottom, #0e1013, #5e5d9f);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Form container box */
        .form-box {
            background: rgba(138, 134, 134, 0.814);
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
        }

        .form-box h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #01080f;
            font-weight: bolder;
            font-family: 'Courier New', Courier, monospace;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px;
        }

        .btn-primary {
            background-color: #007bff;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 10px;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .btn-secondary {
            border-radius: 10px;
            padding: 6px 12px;
        }

        .form-label {
            font-weight: bold;
        }

        #map {
            width: 100%;
            height: 300px;
            margin-top: 20px;
            border-radius: 10px;
        }

        /* Responsive design */
        @media (max-width: 576px) {
            .form-box {
                padding: 30px 20px;
            }

            .form-box h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Form container -->
    <div class="form-box">
        <h2>REPORT A PROBLEM</h2>
        <form onsubmit="reportProblem(event)">
            <div class="mb-3">
                <label for="description" class="form-label">Problem Description</label>
                <textarea id="description" class="form-control" rows="3" placeholder="Describe the problem here..." required></textarea>
            </div>
            <div class="mb-3">
                <label for="image" class="form-label">Upload an Image</label>
                <input type="file" id="image" class="form-control" accept="image/*" >
            </div>
            <div class="mb-3">
                <label class="form-label">Location</label>
                <div id="map"></div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Submit</button>
        </form>
    </div>

    <script>
        let map;
        let marker;
        let userLat, userLng;

        function initMap() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLat = position.coords.latitude;
                        userLng = position.coords.longitude;

                        // Initialize the map centered on user's location
                        map = new google.maps.Map(document.getElementById("map"), {
                            center: { lat: userLat, lng: userLng },
                            zoom: 15,
                        });

                        // Place a marker on the map
                        marker = new google.maps.Marker({
                            position: { lat: userLat, lng: userLng },
                            map: map,
                            title: "Your Location",
                        });
                    },
                    () => {
                        alert("Unable to retrieve your location.");
                    }
                );
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        }

        async function reportProblem(event) {
            event.preventDefault();

            const description = document.getElementById("description").value;
            const imageFile = document.getElementById("image").files[0];

            if (!imageFile) {
                alert("Please upload an image.");
                return;
            }

            const formData = new FormData();
            formData.append("description", description);
            formData.append("location", JSON.stringify({ lat: userLat, lng: userLng }));
            formData.append("image", imageFile);

            try {
                const response = await fetch("http://localhost:5000/api/problems/report", {
                    method: "POST",
                    body: formData,
                });

                const result = await response.json();
                if (response.ok) {
                    alert(result.message || "Problem reported successfully!");
                    window.location.href = "welcome.html";
                } else {
                    alert(result.error || "Error reporting problem.");
                }
            } catch (error) {
                alert("Error connecting to the server.");
                console.error(error);
            }
        }

        // Initialize map on page load
        window.onload = initMap;
    </script>
</body>
</html>
